# Serves the built SPA and proxies /api to the API container, so the browser sees one origin
# (no CORS, and the httpOnly refresh cookie works).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite's hashed bundles never change: cache them for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients can't spoof their IP; the API trusts exactly one hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stopping the Minecraft server can take up to 30s.
        proxy_read_timeout 60s;
    }

    # Client-side routes fall back to index.html, which must always be revalidated.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
