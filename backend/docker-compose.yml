services:
  api:
    build: .
    # Non-secret settings come from config/*.yaml (mounted below; edit + restart, no rebuild).
    # Only the runtime mode, the Docker overlay and secrets are passed as env.
    environment:
      NODE_ENV: production
      CONFIG_OVERLAY: config/config.docker.yaml
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      MINECRAFT_RCON_PASSWORD: ${MINECRAFT_RCON_PASSWORD}
    # Browsers reach the API through the web service's /api proxy; this port is only for local
    # debugging (curl, Swagger at http://localhost:3000/api/docs).
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../modules/minecraft-server:/srv/minecraft
      - ./config:/app/config:ro
    depends_on:
      - mongo

  # The web UI: nginx serves the built frontend and proxies /api to the api service, so the
  # browser sees a single origin (no CORS; the httpOnly refresh cookie works).
  web:
    build: ../frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  mongo:
    image: mongo:7
    # No authentication is configured, so only expose it on the host's loopback (for `make dev`).
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  # Off by default: the profile keeps a plain `docker compose up` from starting it, and
  # `restart: "no"` keeps it down after a host/Docker restart. Create it once with
  # `make minecraft-create` (docker-up does this); the API starts it via POST /api/minecraft/start.
  minecraft:
    profiles: ["minecraft"]
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: "no"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      OVERRIDE_SERVER_PROPERTIES: "false"
      RCON_PASSWORD: ${MINECRAFT_RCON_PASSWORD}
    ports:
      - "25565:25565"
    volumes:
      - ../modules/minecraft-server:/data

volumes:
  mongo-data:
